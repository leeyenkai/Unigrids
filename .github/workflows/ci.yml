name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: UnigridsKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        working-directory: Packages/UnigridsKit
        run: swift test

  app:
    name: Build app (${{ matrix.label }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS Simulator
            destination: generic/platform=iOS Simulator
          - label: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Build
        run: |
          xcodebuild \
            -project App/Unigrids.xcodeproj \
            -scheme Unigrids \
            -destination '${{ matrix.destination }}' \
            -configuration Debug \
            build

  lint:
    name: Format and lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: SwiftFormat
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict

  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Ruff
        working-directory: Pipeline
        run: uv run --with ruff ruff check .

      - name: Tests
        working-directory: Pipeline
        run: uv run --with pytest python -m pytest tests -q

      # The bundled reference data is built by `unigrids_pipeline reference` from a dated
      # raw snapshot that is too large to commit, so CI cannot rebuild it. The Swift
      # `BundledDataTests` hold the built data to its rules instead.
