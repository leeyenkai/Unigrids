# SwiftLint configuration.
#
# The rules here encode the parts of AGENTS.md a tool can actually check: no force
# unwrapping, no god files, documented public API at module boundaries.

included:
  - App
  - Packages/UnigridsKit/Sources
  - Packages/UnigridsKit/Tests

excluded:
  - .build
  - Packages/UnigridsKit/.build
  - DerivedData
  - Pipeline

# Not enabled, deliberately:
#   redundant_type_annotation — SwiftData `@Model` properties carry explicit types on
#   purpose. The schema is the contract between the app and CloudKit, and reading
#   `var seedBits: Int64 = 0` tells you what is stored; `var seedBits = 0` does not.

disabled_rules:
  # SwiftUI view bodies legitimately nest deeply; the real guard is small subviews,
  # which `type_body_length` and review cover.
  - closure_body_length
  # Trailing closures read worse than named arguments in several SwiftUI call sites.
  - multiple_closures_with_trailing_closure
  - todo

opt_in_rules:
  - array_init
  - force_unwrapping
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 100
  error: 120
  ignores_comments: false
  ignores_urls: true

type_body_length:
  warning: 320
  error: 450

file_length:
  warning: 500
  error: 700

function_body_length:
  warning: 70
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20
  # A switch over an enum's cases is the clearest way to map each case to its view or
  # value; counting every case as a branch only pushes it into less readable shapes.
  ignores_case_statements: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - a
    - z

nesting:
  type_level: 2

# Force unwrapping and `try!` are banned outside tests (AGENTS.md §3).
force_cast: error
force_unwrapping: error
force_try: error

trailing_comma:
  mandatory_comma: true

custom_rules:
  no_print:
    name: "No print in app code"
    regex: '(?<![\w."])print\('
    match_kinds:
      - identifier
    message: "Use a logger, not print. App code should not write to stdout."
    severity: warning
  no_nps_arrowhead:
    name: "No NPS arrowhead"
    # Identifiers and asset names only. Prose that explains why the arrowhead is never
    # used is exactly what the repository should contain, so string and comment kinds
    # are out of scope; an asset catalogue is not Swift, so that stays a review matter.
    regex: '(?i)arrowhead'
    match_kinds:
      - identifier
      - typeidentifier
    message: "The NPS arrowhead is a registered trademark and must never be used (AGENTS.md §5)."
    severity: error
